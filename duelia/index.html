  <body>
    <!-- écran de démarrage : visible dès l'ouverture, retiré une fois le jeu prêt -->
    <!-- écran de démarrage : visible dès l'ouverture, avec des bulles qui remontent, retiré une fois le jeu prêt -->
    <div id="splash" aria-hidden="true">
      <img src="/splash/kraken-splash.webp" alt="" />
      <div class="bubbles"><i style="--x:44%;--s:10px;--d:4.5s;--w:0.1s;--o:0.76"></i><i style="--x:15%;--s:12px;--d:5.1s;--w:2.4s;--o:0.46"></i><i style="--x:14%;--s:14px;--d:4.6s;--w:0.6s;--o:0.63"></i><i style="--x:10%;--s:28px;--d:5.1s;--w:2.5s;--o:0.67"></i><i style="--x:77%;--s:8px;--d:5.1s;--w:1.0s;--o:0.84"></i><i style="--x:8%;--s:18px;--d:6.0s;--w:0.8s;--o:0.42"></i><i style="--x:18%;--s:18px;--d:4.2s;--w:2.1s;--o:0.44"></i><i style="--x:77%;--s:18px;--d:5.3s;--w:1.0s;--o:0.62"></i><i style="--x:11%;--s:18px;--d:3.4s;--w:0.5s;--o:0.69"></i><i style="--x:57%;--s:28px;--d:4.2s;--w:1.5s;--o:0.58"></i><i style="--x:41%;--s:10px;--d:5.8s;--w:1.8s;--o:0.47"></i><i style="--x:76%;--s:12px;--d:4.9s;--w:2.3s;--o:0.71"></i><i style="--x:39%;--s:18px;--d:6.4s;--w:0.3s;--o:0.56"></i><i style="--x:46%;--s:10px;--d:6.3s;--w:1.1s;--o:0.83"></i><i style="--x:12%;--s:28px;--d:5.0s;--w:2.1s;--o:0.76"></i><i style="--x:46%;--s:22px;--d:4.4s;--w:1.3s;--o:0.75"></i><i style="--x:11%;--s:28px;--d:3.5s;--w:0.7s;--o:0.70"></i><i style="--x:11%;--s:8px;--d:5.6s;--w:0.8s;--o:0.64"></i></div>
    </div>
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #0b0420; transition: opacity 0.5s ease, transform 0.5s ease; }
      #splash img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: splashIn 0.8s cubic-bezier(.2,1.2,.4,1) both, splashFloat 4s 0.8s ease-in-out infinite; }
      #splash .bubbles { position: absolute; inset: 0; pointer-events: none; }
      #splash .bubbles i { position: absolute; left: var(--x); bottom: -40px; width: var(--s); height: var(--s); border-radius: 50%; opacity: 0;
        background: radial-gradient(circle at 32% 30%, #ffffffcc 0 12%, #d9b8ff55 22%, #9b4dff22 60%, #c58bff66 100%);
        box-shadow: inset 0 0 0 1.5px #d9b8ff88, 0 0 10px #a866ff55;
        animation: bubbleUp var(--d) var(--w) ease-in infinite; }
      #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      @keyframes splashIn { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
      @keyframes splashFloat { 0%, 100% { transform: none; } 50% { transform: translateY(-6px) scale(1.01); } }
      @keyframes bubbleUp { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: var(--o); } 50% { transform: translate(12px, -55vh); } 90% { opacity: var(--o); } 100% { transform: translate(-8px, -110vh); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .bubbles i { animation: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
