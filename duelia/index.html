  <body>
    <!-- écran de démarrage : visible dès l'ouverture, retiré une fois le jeu prêt -->
    <div id="splash" aria-hidden="true">
      <img src="/splash/kraken-splash.webp" alt="" />
    </div>
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; background: #0b0420; transition: opacity 0.45s ease, transform 0.45s ease; }
      #splash::before { content: ''; position: absolute; inset: -40px; background: url(/splash/kraken-splash.webp) center / cover; filter: blur(30px) brightness(0.55); }
      #splash img { position: relative; width: 100%; height: 100%; object-fit: contain; animation: splashIn 0.7s cubic-bezier(.2,1.2,.4,1) both; }
      #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      @keyframes splashIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
